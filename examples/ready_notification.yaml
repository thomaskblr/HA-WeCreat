alias: WeCreat ready for next piece
triggers:
  - trigger: state
    entity_id: sensor.your_laser_process_status
    from: "cooldown"
    to: "ready"
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: WeCreat
      message: Fan cooldown ended. Your laser is ready for the next piece.
mode: single
